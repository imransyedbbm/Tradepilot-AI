services:
  db:
    image: postgres:16.4
    environment: {POSTGRES_USER: tradepilot, POSTGRES_PASSWORD: tradepilot, POSTGRES_DB: tradepilot}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U tradepilot"], interval: 5s, retries: 10}
  api:
    build: .
    env_file: .env
    environment:
      TP_DATABASE_URL: postgresql+psycopg://tradepilot:tradepilot@db:5432/tradepilot
    ports: ["127.0.0.1:8000:8000"]
    depends_on: {db: {condition: service_healthy}}
volumes:
  pgdata:
